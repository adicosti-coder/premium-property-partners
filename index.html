    <!-- Preload hero LCP image — single 800w file for ALL viewports (mobile-first).
         No imagesrcset on link rel=preload because retina DPR would force browser
         to fetch the 1920w (~150KB) variant on small phones. The static shell <img>
         below also uses ONLY 800w so the byte cost is ~35KB instead of ~150KB. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high"
          href="/images/hero-optimized-800w.webp" />

    <!-- Preload ONLY the fonts used in the static hero shell to minimize font-swap CLS. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/PlayfairDisplay-SemiBold-latin-ext.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-SemiBold.woff2" crossorigin />

    <!-- Critical above-fold CSS inlined to eliminate render-blocking wait.
         Includes header + hero shell styles so first paint is complete before
         the main stylesheet hydrates. -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;border-width:0;border-style:solid}
      html{line-height:1.5;-webkit-text-size-adjust:100%;tab-size:4;font-family:'Inter','Inter Fallback',system-ui,-apple-system,sans-serif}
      :root,.light{--background:40 25% 96%;--foreground:222 47% 11%;--primary:45 90% 28%;--primary-foreground:0 0% 100%;--muted:40 20% 92%;--muted-foreground:222 30% 40%;--border:40 20% 80%;--card:0 0% 100%;--card-foreground:222 47% 11%;--radius:0.5rem}
      .dark{--background:222 47% 11%;--foreground:210 40% 98%;--primary:45 90% 38%;--primary-foreground:222 47% 11%;--muted:222 30% 20%;--muted-foreground:210 40% 70%;--border:222 30% 25%;--card:222 47% 14%;--card-foreground:210 40% 98%}
      body{font-family:'NotoSans','Inter Fallback',system-ui,-apple-system,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));-webkit-font-smoothing:antialiased;min-height:100vh;line-height:inherit}
      h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit}
      img,video{max-width:100%;height:auto;display:block}
      button{font-family:inherit;cursor:pointer;background:transparent;border:0;color:inherit}
      a{color:inherit;text-decoration:inherit}
      .cv-auto{content-visibility:auto;contain-intrinsic-size:1px 600px}
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
      [hidden]{display:none}
      /* Reserve viewport space identically to React Hero so hydration causes ZERO layout shift.
         No text/buttons/images here — only a same-size placeholder background. */
      #app-shell-placeholder{min-height:100dvh;background:hsl(var(--background));display:block}
    </style>

    <!-- Self-hosted Google Fonts — eliminates 2 DNS lookups + external requests -->
    <style>
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/PlayfairDisplay-SemiBold-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Playfair Display';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/PlayfairDisplay-SemiBold-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    </style>

    <script>
      (function () {
        try {
          if (typeof window === "undefined" || typeof document === "undefined") return;
          var stored = window.localStorage && window.localStorage.getItem("theme");
          var theme = stored || "light";
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("lang", "ro");
          document.documentElement.setAttribute("xml:lang", "ro");
        } catch (_) {}
      })();
    </script>

    <!-- Main stylesheet loads normally (render-blocking) to prevent FOUC.
         Critical inline CSS above paints the hero shell instantly for LCP;
         Vite-injected CSS arrives in parallel and styles the rest before paint. -->

</head>

  <body>

    <!-- GA4 deferred — loads on first user interaction to avoid TBT impact -->
    <script>
      (function() {
        var loaded = false;
        function loadGA4() {
          if (loaded) return;
          loaded = true;
          events.forEach(function(e) { document.removeEventListener(e, loadGA4); });
          clearTimeout(fallback);
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-JXDGWL3G6V';
          s.async = true;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){window.dataLayer.push(arguments);}
          window.gtag = window.gtag || gtag;
          gtag('js', new Date());
          gtag('config', 'G-JXDGWL3G6V');
        }
        var events = ['scroll', 'click', 'touchstart', 'keydown'];
        events.forEach(function(e) { document.addEventListener(e, loadGA4, { once: true, passive: true }); });
        var fallback = setTimeout(loadGA4, 45000);
      })();
    </script>
    <script type="module" src="/src/main.tsx" data-cfasync="false"></script>
