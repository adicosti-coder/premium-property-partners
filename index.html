    <!-- Critical above-fold CSS inlined to eliminate render-blocking wait -->
    <style>
      /* Hero section layout — renders before external CSS loads */
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'NotoSans',system-ui,-apple-system,sans-serif;background:#f7f5f0;color:#1e293b}
      .dark body{background:#0f172a;color:#e2e8f0}
      #hero-skeleton{position:fixed;inset:0;z-index:9999;min-height:100dvh;min-height:100vh;display:flex;align-items:center;overflow:hidden;padding-top:7rem}
      #hero-skeleton .hero-bg{position:absolute;inset:0}
      #hero-skeleton .hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      #hero-skeleton .hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(247,245,240,0.85),rgba(247,245,240,0.45),transparent)}
      .dark #hero-skeleton .hero-overlay{background:linear-gradient(to right,rgba(15,23,42,0.7),rgba(15,23,42,0.3),transparent)}
      #hero-skeleton .hero-content{position:relative;z-index:10;max-width:56rem;padding:5rem 1.5rem}
      #hero-skeleton .hero-content h1{font-family:'Playfair Display','Playfair Display Fallback','Times New Roman',serif;font-size:clamp(2.25rem,5vw,4.5rem);font-weight:600;line-height:1.1;margin-bottom:1.5rem;color:#1e293b}

      .dark #hero-skeleton .hero-content h1,.dark #hero-skeleton .hero-content p{color:#e2e8f0}
      /* Skeleton hidden by React Hero component via JS for optimal LCP */
      #hero-skeleton.hero-ready{opacity:0;pointer-events:none;transition:opacity .15s ease-out}
      #hero-skeleton.hero-gone{display:none}
      /* CSS containment — isolates layout/paint per section to reduce reflow cost */
      .cv-auto{contain:content}
    </style>

    <!-- JSON-LD injected dynamically by SEOHead.tsx with correct address data -->
    
    <script>
      (function () {
        try {
          if (typeof window === "undefined" || typeof document === "undefined") return;
          var stored = window.localStorage && window.localStorage.getItem("theme");
          var theme = stored || "light";
          document.documentElement.classList.add(theme);
        } catch (_) {}
      })();
      // Convert Vite-injected render-blocking CSS to async loading.
      // Critical styles are already inlined above, so the full stylesheet
      // can load without blocking first paint / LCP.
      (function () {
        try {
          var observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (m) {
              m.addedNodes.forEach(function (node) {
                if (node.tagName === 'LINK' && node.rel === 'stylesheet' && node.href && node.href.indexOf('/assets/') !== -1) {
                  node.media = 'print';
                  node.onload = function () { node.media = 'all'; };
                }
              });
            });
          });
          observer.observe(document.head, { childList: true });
          // Stop observing after 5s — all links will be injected by then
          setTimeout(function () { observer.disconnect(); }, 5000);
        } catch (_) {}
      })();
    </script>

    <!-- Sentry loaded lazily via src/lib/sentry.ts – no blocking script needed -->
